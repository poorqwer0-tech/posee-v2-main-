plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'co.posee.print'
    compileSdk 34

    defaultConfig {
        applicationId 'co.posee.print'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Sunmi inner printer SDK (Maven Central) — ให้ com.sunmi.peripheral.printer.*
    implementation 'com.sunmi:printerlibrary:1.0.14'
}
